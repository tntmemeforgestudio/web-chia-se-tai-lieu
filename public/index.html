<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Góc Chia Sẻ Tài Liệu - v2.0.2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> 
        body { 
            font-family: 'Inter', sans-serif; 
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        @media (max-width: 640px) {
            input, textarea, select { font-size: 16px !important; }
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex flex-col justify-between relative pb-14 antialiased selection:bg-blue-100">

    <div id="toast" class="fixed top-3 left-3 right-3 sm:left-auto sm:right-4 sm:max-w-sm bg-gray-900 text-white px-4 py-3 rounded-2xl shadow-2xl z-50 hidden flex items-center gap-3 text-xs sm:text-sm font-medium border border-gray-800">
        <i data-lucide="info" class="w-4 h-4 shrink-0 text-blue-400"></i>
        <span id="toast-text" class="truncate">Đang xử lý...</span>
    </div>

    <header class="bg-white/95 backdrop-blur-md border-b border-gray-200 sticky top-0 z-40 px-3 sm:px-6 py-2.5 sm:py-3.5 shadow-sm flex items-center justify-between">
        <div class="flex items-center space-x-2.5 min-w-0">
            <div class="w-9 h-9 bg-blue-600 text-white rounded-xl flex items-center justify-center shadow-md shadow-blue-500/20 shrink-0">
                <i data-lucide="folder-git-2" class="w-5 h-5"></i>
            </div>
            <h1 class="font-bold text-sm sm:text-lg text-gray-900 tracking-tight truncate">Góc Chia Sẻ Tài Liệu</h1>
        </div>
        
        <div class="flex items-center space-x-2 shrink-0">
            <button onclick="toggleModal('postModal')" title="Đăng bài mới"
                class="bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-semibold px-3 py-2 sm:px-4 sm:py-2.5 rounded-xl flex items-center gap-1.5 shadow-md shadow-blue-500/20 text-xs sm:text-sm transition">
                <i data-lucide="plus" class="w-4 h-4"></i>
                <span class="hidden xs:inline">Đăng bài</span>
            </button>

            <button onclick="toggleModal('settingsModal')" title="Cài đặt"
                class="bg-gray-100 hover:bg-gray-200 active:scale-95 text-gray-700 p-2 sm:p-2.5 rounded-xl transition border border-gray-200">
                <i data-lucide="settings" class="w-4 h-4 sm:w-5 sm:h-5"></i>
            </button>
        </div>
    </header>

    <main class="max-w-xl mx-auto w-full px-3 sm:px-4 py-4 sm:py-6 flex-grow space-y-3.5">
        <div class="flex justify-between items-center px-1">
            <h2 class="font-bold text-gray-800 text-xs sm:text-sm tracking-wide uppercase">Dòng thời gian</h2>
            <span class="text-[11px] font-semibold text-emerald-600 bg-emerald-50 border border-emerald-200 px-2.5 py-0.5 rounded-full flex items-center gap-1">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> Live System
            </span>
        </div>

        <div id="postsContainer" class="space-y-3 sm:space-y-4">
            <div class="bg-white p-8 rounded-2xl text-center text-gray-500 border border-gray-200 shadow-sm flex flex-col items-center justify-center gap-2.5">
                <i data-lucide="loader-2" class="w-6 h-6 animate-spin text-blue-600"></i>
                <span class="text-xs sm:text-sm font-medium text-gray-600">Đang tải bài viết...</span>
            </div>
        </div>
    </main>

    <!-- Modal Đăng Bài -->
    <div id="postModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 transition-all">
        <div class="bg-white rounded-t-3xl sm:rounded-2xl max-w-lg w-full p-4 sm:p-6 shadow-2xl relative border border-gray-100 max-h-[92vh] overflow-y-auto">
            <div class="w-12 h-1.5 bg-gray-300 rounded-full mx-auto mb-3 sm:hidden"></div>
            
            <button onclick="toggleModal('postModal')" class="absolute top-3 right-3 sm:top-4 sm:right-4 text-gray-400 hover:text-gray-600 p-1.5 rounded-full bg-gray-100 sm:bg-transparent">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
            <h3 class="font-bold text-base sm:text-lg mb-4 text-gray-900 flex items-center gap-2">
                <i data-lucide="square-pen" class="w-5 h-5 text-blue-600"></i> Đăng bài mới
            </h3>
            
            <form id="uploadForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Tên tác giả</label>
                    <input type="text" id="author" name="author" placeholder="Nhập tên của bạn..."
                        class="w-full border border-gray-300 rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50/50">
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Nội dung bài viết</label>
                    <textarea id="content" name="content" rows="4" required placeholder="Nội dung cần chia sẻ..."
                        class="w-full border border-gray-300 rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50/50 resize-y"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Tệp đính kèm (Ảnh/Tài liệu/Video)</label>
                    <input type="file" id="fileInput" class="w-full border border-gray-300 rounded-xl p-2 text-xs bg-gray-50 text-gray-600 outline-none file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer">
                    <p class="text-[11px] text-gray-500 mt-1 font-medium">📌 Giới hạn tải lên tối đa 50MB.</p>
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 active:scale-98 text-white font-semibold py-3 rounded-xl transition flex items-center justify-center gap-2 text-sm shadow-md shadow-blue-500/20">
                    <i data-lucide="send" class="w-4 h-4"></i> Đăng bài
                </button>
            </form>
        </div>
    </div>

    <!-- Modal Cài đặt & Ngôn ngữ -->
    <div id="settingsModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white rounded-t-3xl sm:rounded-2xl max-w-sm w-full p-4 sm:p-6 shadow-2xl relative border border-gray-100">
            <div class="w-12 h-1.5 bg-gray-300 rounded-full mx-auto mb-3 sm:hidden"></div>
            <button onclick="toggleModal('settingsModal')" class="absolute top-3 right-3 sm:top-4 sm:right-4 text-gray-400 hover:text-gray-600 p-1.5 rounded-full bg-gray-100 sm:bg-transparent">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
            <h3 class="font-bold text-base sm:text-lg mb-4 text-gray-900 flex items-center gap-2">
                <i data-lucide="sliders" class="w-5 h-5 text-gray-700"></i> Cài đặt hệ thống
            </h3>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-500 mb-1.5">Công cụ dịch ngôn ngữ</label>
                    <div id="google_translate_element"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Xác nhận xóa -->
    <div id="deleteConfirmModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-xs w-full p-5 shadow-2xl relative border border-gray-100 text-center space-y-4">
            <div class="w-12 h-12 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto">
                <i data-lucide="alert-triangle" class="w-6 h-6"></i>
            </div>
            <div>
                <h4 class="font-bold text-gray-900 text-base">Xóa bài viết?</h4>
                <p class="text-xs text-gray-500 mt-1">Hành động này không thể hoàn tác.</p>
            </div>
            <div class="flex items-center gap-2 pt-1">
                <button onclick="toggleModal('deleteConfirmModal')" class="w-1/2 bg-gray-100 hover:bg-gray-200 text-gray-700 py-2.5 rounded-xl text-xs font-semibold transition">Hủy</button>
                <button id="btnConfirmDelete" class="w-1/2 bg-red-600 hover:bg-red-700 text-white py-2.5 rounded-xl text-xs font-semibold transition shadow-md shadow-red-500/20">Xóa bài</button>
            </div>
        </div>
    </div>

    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({ pageLanguage: 'vi', layout: google.translate.TranslateElement.InlineLayout.SIMPLE }, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <script>
        let deleteTargetId = null;

        function getDeviceToken() {
            let token = localStorage.getItem('user_device_token');
            if (!token) {
                token = 'token_' + Math.random().toString(36).substring(2) + Date.now();
                localStorage.setItem('user_device_token', token);
            }
            return token;
        }

        function getMyCreatedPosts() {
            try { return JSON.parse(localStorage.getItem('my_created_posts') || '[]'); } catch(e) { return []; }
        }

        function saveMyCreatedPost(id) {
            const myPosts = getMyCreatedPosts();
            if (!myPosts.includes(id)) {
                myPosts.push(id);
                localStorage.setItem('my_created_posts', JSON.stringify(myPosts));
            }
        }

        function toggleModal(id) {
            document.getElementById(id).classList.toggle('hidden');
        }

        function showToast(text) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-text').innerText = text;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3500);
        }

        function getLikedPosts() {
            try { return JSON.parse(localStorage.getItem('user_liked_posts') || '[]'); } catch(e) { return []; }
        }

        function setLikedPost(id) {
            const liked = getLikedPosts();
            if (!liked.includes(id)) {
                liked.push(id);
                localStorage.setItem('user_liked_posts', JSON.stringify(liked));
            }
        }

        // Tải danh sách bài viết từ Backend API
        async function fetchPosts() {
            const container = document.getElementById('postsContainer');
            try {
                const res = await fetch('/api/posts');
                if (!res.ok) throw new Error("Lỗi kết nối máy chủ");
                
                const posts = await res.json();
                const likedPosts = getLikedPosts();
                const myPosts = getMyCreatedPosts();
                
                if (!posts || posts.length === 0) {
                    container.innerHTML = `<div class="bg-white p-8 rounded-2xl text-center text-gray-400 border border-gray-200 shadow-sm text-xs sm:text-sm">Chưa có bài viết nào. Hãy là người đầu tiên đăng bài!</div>`;
                    return;
                }

                container.innerHTML = posts.map(p => {
                    const dateStr = new Date(p.createdAt).toLocaleString('vi-VN', {
                        hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit', year: 'numeric'
                    });

                    const isLiked = likedPosts.includes(p._id);
                    const isMyPost = myPosts.includes(p._id);

                    const likeStyle = isLiked 
                        ? 'bg-blue-600 text-white font-bold px-3 py-1.5 rounded-lg shadow-sm' 
                        : 'text-gray-600 hover:text-blue-600 hover:bg-gray-100 px-2.5 py-1.5 rounded-lg';

                    const deleteButtonHTML = isMyPost ? `
                        <button onclick="promptDeletePost('${p._id}')" title="Xóa bài viết của bạn" class="text-gray-400 hover:text-red-600 p-2 rounded-lg hover:bg-red-50 transition active:scale-95">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    ` : '';

                    let mediaHTML = '';
                    if (p.mediaUrl) {
                        if (p.mediaUrl.startsWith('data:image/')) {
                            mediaHTML = `<img src="${p.mediaUrl}" loading="lazy" class="mt-2.5 max-h-72 w-full object-cover rounded-xl border border-gray-100">`;
                        } else {
                            mediaHTML = `<a href="${p.mediaUrl}" download="${p.mediaName || 'file-dinh-kem'}" class="mt-2.5 inline-flex items-center gap-2 bg-gray-50 border border-gray-200 p-3 rounded-xl text-xs font-medium text-blue-600 hover:bg-blue-50 transition max-w-full truncate">
                                <i data-lucide="paperclip" class="w-4 h-4 shrink-0"></i> <span class="truncate">${p.mediaName || 'Tải tệp đính kèm'}</span>
                            </a>`;
                        }
                    }

                    return `
                    <div class="bg-white p-4 sm:p-5 rounded-2xl border border-gray-200 shadow-sm space-y-3">
                        <div class="flex justify-between items-center">
                            <div class="font-bold text-gray-900 text-xs sm:text-sm flex items-center gap-2.5 min-w-0">
                                <div class="w-8 h-8 bg-blue-100 text-blue-700 rounded-full flex items-center justify-center font-bold text-xs uppercase shrink-0">
                                    ${(p.author || 'A').charAt(0)}
                                </div>
                                <div class="min-w-0">
                                    <div class="text-xs sm:text-sm font-semibold text-gray-900 truncate">${p.author || 'Ẩn danh'}</div>
                                    <div class="text-[10px] sm:text-[11px] text-gray-400 font-normal">${dateStr}</div>
                                </div>
                            </div>
                            ${deleteButtonHTML}
                        </div>

                        <div class="text-gray-800 text-xs sm:text-sm leading-relaxed whitespace-pre-wrap break-words">${p.content}</div>

                        ${mediaHTML}

                        <div class="flex items-center gap-3 pt-2 border-t border-gray-100 text-xs">
                            <button onclick="likePost('${p._id}')" class="flex items-center gap-1.5 transition active:scale-95 ${likeStyle}">
                                <i data-lucide="thumbs-up" class="w-4 h-4"></i>
                                <span>${p.likes || 0}</span>
                            </button>
                            <button onclick="dislikePost('${p._id}')" class="flex items-center gap-1.5 text-gray-600 hover:text-red-600 hover:bg-gray-100 px-2.5 py-1.5 rounded-lg transition active:scale-95">
                                <i data-lucide="thumbs-down" class="w-4 h-4"></i>
                                <span>${p.dislikes || 0}</span>
                            </button>
                        </div>
                    </div>
                `}).join('');

                if (window.lucide) lucide.createIcons();
            } catch(e) {
                container.innerHTML = `
                    <div class="bg-white p-6 rounded-2xl text-center border border-red-200 shadow-sm space-y-3">
                        <p class="text-xs sm:text-sm text-red-600 font-medium">Không thể kết nối đến máy chủ. Vui lòng kiểm tra lại kết nối mạng hoặc cơ sở dữ liệu.</p>
                        <button onclick="fetchPosts()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-4 py-2 rounded-xl font-semibold transition">Thử tải lại</button>
                    </div>
                `;
            }
        }

        async function likePost(id) {
            const liked = getLikedPosts();
            if (liked.includes(id)) {
                showToast("Bạn đã thích bài viết này rồi!");
                return;
            }
            setLikedPost(id);
            await fetch(`/api/posts/${id}/like`, { method: 'POST' });
            fetchPosts();
        }

        async function dislikePost(id) {
            await fetch(`/api/posts/${id}/dislike`, { method: 'POST' });
            fetchPosts();
        }

        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const author = document.getElementById('author').value;
            const content = document.getElementById('content').value;
            const fileInput = document.getElementById('fileInput');
            const authorToken = getDeviceToken();
            
            let mediaUrl = '';
            let mediaName = '';

            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                if (file.size > 50 * 1024 * 1024) {
                    alert("Tệp quá lớn! Vui lòng chọn tệp dung lượng dưới 50MB.");
                    return;
                }
                mediaName = file.name;
                showToast("Đang xử lý tệp đính kèm...");
                mediaUrl = await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve(e.target.result);
                    reader.readAsDataURL(file);
                });
            }

            toggleModal('postModal');
            showToast("Đang gửi bài viết...");

            document.getElementById('author').value = '';
            document.getElementById('content').value = '';
            fileInput.value = '';

            const res = await fetch('/api/posts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ author, content, mediaUrl, mediaName, authorToken })
            });

            if (res.ok) {
                const createdPost = await res.json();
                if (createdPost && createdPost._id) {
                    saveMyCreatedPost(createdPost._id);
                }
            }

            fetchPosts();
        });

        function promptDeletePost(id) {
            deleteTargetId = id;
            toggleModal('deleteConfirmModal');
        }

        document.getElementById('btnConfirmDelete').addEventListener('click', async () => {
            if (deleteTargetId) {
                toggleModal('deleteConfirmModal');
                showToast("Đang xóa bài...");

                const res = await fetch(`/api/posts/${deleteTargetId}`, { 
                    method: 'DELETE',
                    headers: { 'x-author-token': getDeviceToken() }
                });

                if (!res.ok) {
                    const errData = await res.json();
                    showToast(errData.error || "Không thể xóa bài viết này!");
                } else {
                    showToast("Đã xóa bài viết!");
                }

                deleteTargetId = null;
                fetchPosts();
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) lucide.createIcons();
            fetchPosts();
        });
    </script>
</body>
</html>
