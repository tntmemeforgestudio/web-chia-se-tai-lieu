<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chia Sẻ Tài Liệu - Phiên bản 2.0.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> 
        body { font-family: 'Inter', sans-serif; }
        .goog-te-gadget-simple {
            border: 1px solid #e5e7eb !important;
            padding: 6px 10px !important;
            border-radius: 8px !important;
            font-size: 13px !important;
            width: 100% !important;
        }
        .goog-te-gadget-icon { display: none !important; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex flex-col justify-between relative pb-10">

    <!-- Thông báo trạng thái -->
    <div id="toast" class="fixed top-4 right-4 bg-blue-600 text-white px-4 py-2.5 rounded-lg shadow-lg z-50 hidden flex items-center gap-2 text-sm font-medium animate-bounce">
        <i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i>
        <span id="toast-text">Đang xử lý bài viết...</span>
    </div>

    <!-- Header chính -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-40 px-6 py-3.5 shadow-sm flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 bg-blue-600 text-white rounded-lg flex items-center justify-center shadow-sm">
                <i data-lucide="folder-git-2" class="w-5 h-5"></i>
            </div>
            <h1 class="font-bold text-lg text-gray-900 tracking-tight" id="txt-title">Chia Sẻ Tài Liệu</h1>
        </div>
        
        <div class="flex items-center space-x-2.5">
            <button onclick="toggleModal('postModal')" title="Đăng bài mới"
                class="bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-medium px-4 py-2 rounded-lg flex items-center gap-1.5 shadow-sm text-sm transition">
                <i data-lucide="plus" class="w-4 h-4"></i>
                <span id="btn-txt-create">Tạo bài mới</span>
            </button>

            <button onclick="toggleModal('settingsModal')" title="Cài đặt"
                class="bg-gray-100 hover:bg-gray-200 active:scale-95 text-gray-700 p-2 rounded-lg transition border border-gray-200">
                <i data-lucide="settings" class="w-5 h-5"></i>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-2xl mx-auto w-full px-4 py-6 flex-grow space-y-4">
        <div class="flex justify-between items-center pb-2">
            <h2 class="font-bold text-gray-800 text-base" id="txt-feed-title">Dòng thời gian & Bài viết</h2>
            <span class="text-xs font-semibold text-emerald-600 bg-emerald-50 border border-emerald-200 px-2.5 py-1 rounded-full flex items-center gap-1">
                <span class="w-2 h-2 rounded-full bg-emerald-500"></span> 512MB Free Tier
            </span>
        </div>

        <div id="postsContainer" class="space-y-4">
            <div class="bg-white p-12 rounded-xl text-center text-gray-500 border border-gray-200 shadow-sm flex flex-col items-center justify-center gap-3">
                <i data-lucide="loader-2" class="w-7 h-7 animate-spin text-blue-600"></i>
                <span class="text-sm font-medium text-gray-600" id="txt-loading">Đang tải bài viết...</span>
            </div>
        </div>
    </main>

    <!-- Modal Đăng Bài (Có chọn tệp + Dòng thông báo 100MB) -->
    <div id="postModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl max-w-lg w-full p-6 shadow-xl relative border border-gray-100">
            <button onclick="toggleModal('postModal')" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 transition p-1">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
            <h3 class="font-bold text-lg mb-4 text-gray-900 flex items-center gap-2" id="txt-modal-post-title">
                <i data-lucide="square-pen" class="w-5 h-5 text-blue-600"></i> Đăng bài mới
            </h3>
            
            <form id="uploadForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-500 mb-1" id="lbl-author">Tên tác giả</label>
                    <input type="text" id="author" name="author" placeholder="Nhập tên của bạn..."
                        class="w-full border border-gray-300 rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-500 mb-1" id="lbl-content">Nội dung bài viết</label>
                    <textarea id="content" name="content" rows="4" required placeholder="Nội dung cần chia sẻ..."
                        class="w-full border border-gray-300 rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-500 resize-y"></textarea>
                </div>

                <!-- Mục gửi tệp đính kèm kèm dòng chữ 100MB -->
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Gửi tệp đính kèm (Ảnh/Tài liệu/Video)</label>
                    <input type="file" id="fileInput" class="w-full border border-gray-300 rounded-lg p-2 text-xs bg-gray-50 text-gray-600 outline-none file:mr-3 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer">
                    <p class="text-[11px] text-gray-500 mt-1 font-medium">📌 Dung lượng gửi tệp/lần gửi giới hạn tối đa 100MB.</p>
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 active:scale-98 text-white font-semibold py-2.5 rounded-lg transition flex items-center justify-center gap-2 text-sm shadow-sm" id="btn-submit">
                    <i data-lucide="send" class="w-4 h-4"></i> Đăng bài
                </button>
            </form>
        </div>
    </div>

    <!-- Modal Cài Đặt Ngôn Ngữ -->
    <div id="settingsModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl max-w-sm w-full p-6 shadow-xl relative border border-gray-100">
            <button onclick="toggleModal('settingsModal')" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 transition p-1">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
            <h3 class="font-bold text-lg mb-4 text-gray-900 flex items-center gap-2" id="txt-settings-title">
                <i data-lucide="sliders" class="w-5 h-5 text-gray-700"></i> Cài đặt hệ thống
            </h3>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-500 mb-2" id="lbl-language">Ngôn ngữ Phổ biến</label>
                    <select id="langSelect" onchange="changeLanguage(this.value)" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm bg-white outline-none focus:ring-2 focus:ring-blue-500 font-medium">
                        <option value="vi">🇻🇳 Tiếng Việt (Vietnamese)</option>
                        <option value="en">🇺🇸 English (Tiếng Anh)</option>
                        <option value="zh">🇨🇳 中文 (Tiếng Trung)</option>
                        <option value="ja">🇯🇵 日本語 (Tiếng Nhật)</option>
                        <option value="ko">🇰🇷 한국어 (Tiếng Hàn)</option>
                        <option value="fr">🇫🇷 Français (Tiếng Pháp)</option>
                        <option value="de">🇩🇪 Deutsch (Tiếng Đức)</option>
                        <option value="es">🇪🇸 Español (Tiếng Tây Ban Nha)</option>
                        <option value="ru">🇷🇺 Русский (Tiếng Nga)</option>
                    </select>
                </div>

                <div class="border-t border-gray-100 pt-3">
                    <label class="block text-xs font-semibold uppercase text-gray-400 mb-1">Tất cả ngôn ngữ khác</label>
                    <div id="google_translate_element"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Xác Nhận Xóa Bài Viết -->
    <div id="deleteConfirmModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl max-w-xs w-full p-5 shadow-xl relative border border-gray-100 text-center space-y-4">
            <div class="w-12 h-12 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto">
                <i data-lucide="alert-triangle" class="w-6 h-6"></i>
            </div>
            <div>
                <h4 class="font-bold text-gray-900 text-base">Xác nhận xóa bài?</h4>
                <p class="text-xs text-gray-500 mt-1">Bạn có chắc chắn muốn xóa bài viết này không? Hành động này không thể hoàn tác.</p>
            </div>
            <div class="flex items-center gap-2 pt-2">
                <button onclick="toggleModal('deleteConfirmModal')" class="w-1/2 bg-gray-100 hover:bg-gray-200 text-gray-700 py-2 rounded-lg text-xs font-semibold transition">Hủy</button>
                <button id="btnConfirmDelete" class="w-1/2 bg-red-600 hover:bg-red-700 text-white py-2 rounded-lg text-xs font-semibold transition">Xóa vĩnh viễn</button>
            </div>
        </div>
    </div>

    <!-- Nhãn v2.0.1 NẰM BÊN TRÁI GÓC DƯỚI MÀN HÌNH -->
    <div class="fixed bottom-3 left-3 bg-white border border-gray-200 text-gray-700 text-xs px-3 py-1 rounded-full shadow-sm z-30 flex items-center gap-1.5 select-none font-medium">
        <span class="w-2 h-2 rounded-full bg-blue-500"></span>
        <span>v2.0.1</span>
    </div>

    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({ pageLanguage: 'vi', layout: google.translate.TranslateElement.InlineLayout.SIMPLE }, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <script>
        let deleteTargetId = null;

        function toggleModal(id) {
            document.getElementById(id).classList.toggle('hidden');
        }

        function showToast(text) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-text').innerText = text;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3500);
        }

        const i18n = {
            vi: { title: "Chia Sẻ Tài Liệu", createBtn: "Tạo bài mới", feedTitle: "Dòng thời gian & Bài viết", loading: "Đang tải bài viết...", postTitle: "Đăng bài mới", author: "Tên tác giả", content: "Nội dung bài viết", submit: "Đăng bài", settings: "Cài đặt hệ thống", lang: "Ngôn ngữ Phổ biến", noPost: "Chưa có bài viết nào. Bấm nút Tạo bài mới ở trên!" },
            en: { title: "File Sharing", createBtn: "New Post", feedTitle: "Timeline & Posts", loading: "Loading posts...", postTitle: "Create New Post", author: "Author Name", content: "Post Content", submit: "Publish Post", settings: "Settings", lang: "Popular Languages", noPost: "No posts yet." }
        };

        function changeLanguage(lang) {
            const t = i18n[lang] || i18n['en'];
            document.getElementById('txt-title').innerText = t.title;
            document.getElementById('btn-txt-create').innerText = t.createBtn;
            document.getElementById('txt-feed-title').innerText = t.feedTitle;
            document.getElementById('txt-loading').innerText = t.loading;
            document.getElementById('txt-modal-post-title').innerText = t.postTitle;
            document.getElementById('lbl-author').innerText = t.author;
            document.getElementById('lbl-content').innerText = t.content;
            document.getElementById('btn-submit').innerText = t.submit;
            document.getElementById('txt-settings-title').innerText = t.settings;
            document.getElementById('lbl-language').innerText = t.lang;
        }

        // Tải danh sách bài viết
        async function fetchPosts() {
            try {
                const res = await fetch('/api/posts');
                const posts = await res.json();
                const container = document.getElementById('postsContainer');
                
                if (!posts || posts.length === 0) {
                    const lang = document.getElementById('langSelect').value;
                    const t = i18n[lang] || i18n['vi'];
                    container.innerHTML = `<div class="bg-white p-8 rounded-xl text-center text-gray-400 border border-gray-200 shadow-sm text-sm">${t.noPost}</div>`;
                    return;
                }

                container.innerHTML = posts.map(p => {
                    const dateStr = new Date(p.createdAt).toLocaleString('vi-VN', {
                        hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit', year: 'numeric'
                    });

                    let mediaHTML = '';
                    if (p.mediaUrl) {
                        if (p.mediaUrl.startsWith('data:image/')) {
                            mediaHTML = `<img src="${p.mediaUrl}" loading="lazy" class="mt-3 max-h-80 rounded-lg border border-gray-100 object-cover">`;
                        } else {
                            mediaHTML = `<a href="${p.mediaUrl}" download="${p.mediaName || 'file-dinh-kem'}" class="mt-3 inline-flex items-center gap-2 bg-gray-50 border border-gray-200 p-2.5 rounded-lg text-xs font-medium text-blue-600 hover:bg-blue-50 transition">
                                <i data-lucide="paperclip" class="w-4 h-4"></i> ${p.mediaName || 'Tải tệp đính kèm'}
                            </a>`;
                        }
                    }

                    return `
                    <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm space-y-3">
                        <div class="flex justify-between items-center">
                            <div class="font-bold text-gray-900 text-sm flex items-center gap-2.5">
                                <div class="w-8 h-8 bg-blue-100 text-blue-700 rounded-full flex items-center justify-center font-bold text-xs uppercase">
                                    ${(p.author || 'A').charAt(0)}
                                </div>
                                <div>
                                    <div class="text-sm font-semibold text-gray-900">${p.author || 'Ẩn danh'}</div>
                                    <div class="text-[11px] text-gray-400 font-normal">${dateStr}</div>
                                </div>
                            </div>
                            <!-- Nút xóa bài viết -->
                            <button onclick="promptDeletePost('${p._id}')" title="Xóa bài viết" class="text-gray-400 hover:text-red-600 transition p-1.5 rounded-lg hover:bg-red-50">
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                        </div>

                        <!-- Giữ đúng định dạng xuống dòng với whitespace-pre-wrap -->
                        <div class="text-gray-800 text-sm leading-relaxed whitespace-pre-wrap break-words">${p.content}</div>

                        ${mediaHTML}

                        <div class="flex items-center gap-4 pt-2 border-t border-gray-100 text-xs text-gray-500">
                            <button onclick="likePost('${p._id}')" class="flex items-center gap-1.5 hover:text-blue-600 transition px-2 py-1 rounded hover:bg-gray-100">
                                <i data-lucide="thumbs-up" class="w-4 h-4"></i>
                                <span>${p.likes || 0}</span>
                            </button>
                            <button onclick="dislikePost('${p._id}')" class="flex items-center gap-1.5 hover:text-red-600 transition px-2 py-1 rounded hover:bg-gray-100">
                                <i data-lucide="thumbs-down" class="w-4 h-4"></i>
                                <span>${p.dislikes || 0}</span>
                            </button>
                        </div>
                    </div>
                `}).join('');

                lucide.createIcons();
            } catch(e) {
                console.log("Đang kết nối...");
            }
        }

        // Đăng bài viết + Kiểm tra giới hạn 100MB
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const author = document.getElementById('author').value;
            const content = document.getElementById('content').value;
            const fileInput = document.getElementById('fileInput');
            
            let mediaUrl = '';
            let mediaName = '';

            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                if (file.size > 100 * 1024 * 1024) {
                    alert("Tệp quá lớn! Vui lòng chọn tệp dung lượng dưới 100MB.");
                    return;
                }
                mediaName = file.name;
                showToast("Đang tải tệp đính kèm...");
                mediaUrl = await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve(e.target.result);
                    reader.readAsDataURL(file);
                });
            }

            toggleModal('postModal');
            showToast("Đang gửi bài viết...");

            document.getElementById('author').value = '';
            document.getElementById('content').value = '';
            fileInput.value = '';

            await fetch('/api/posts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ author, content, mediaUrl, mediaName })
            });

            fetchPosts();
        });

        // Mở bảng xác nhận xóa
        function promptDeletePost(id) {
            deleteTargetId = id;
            toggleModal('deleteConfirmModal');
        }

        // Thực hiện xóa khi bấm Xóa vĩnh viễn trong modal
        document.getElementById('btnConfirmDelete').addEventListener('click', async () => {
            if (deleteTargetId) {
                toggleModal('deleteConfirmModal');
                showToast("Đang xóa bài...");
                await fetch(`/api/posts/${deleteTargetId}`, { method: 'DELETE' });
                deleteTargetId = null;
                fetchPosts();
            }
        });

        async function likePost(id) {
            await fetch(`/api/posts/${id}/like`, { method: 'POST' });
            fetchPosts();
        }

        async function dislikePost(id) {
            await fetch(`/api/posts/${id}/dislike`, { method: 'POST' });
            fetchPosts();
        }

        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            fetchPosts();
        });
    </script>
</body>
</html>
