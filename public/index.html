<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Góc Chia Sẻ Tài Liệu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .post-card { background: #fff; border-radius: 12px; border: 1px solid #e0e0e0; transition: all 0.2s; }
        .post-card.vip-border { border: 2px solid #ffd700 !important; box-shadow: 0 0 10px rgba(255, 215, 0, 0.3); }
        .vip-badge { color: #d4af37; font-weight: bold; margin-left: 5px; }
        .translator-box { position: fixed; bottom: 15px; right: 15px; z-index: 9999; background: #fff; padding: 6px 12px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); }
        .media-preview-container img, .media-preview-container video { max-width: 100%; border-radius: 8px; margin-top: 10px; }
    </style>
</head>
<body>

    <!-- Công cụ dịch đa ngôn ngữ tự động -->
    <div class="translator-box">
        <i class="fa-solid font-awesome-flag me-1"></i> <span style="font-size: 12px;">Dịch:</span>
        <div id="google_translate_element" style="display: inline-block;"></div>
    </div>

    <div class="container py-4" style="max-width: 720px;">
        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4 bg-white p-3 rounded-3 shadow-sm">
            <div>
                <h4 class="m-0 fw-bold text-primary"><i class="fa-solid fa-folder-open me-2"></i>Góc Chia Sẻ Tài Liệu</h4>
                <small class="text-muted">Hệ thống lưu trữ trực tuyến v2.1.0</small>
            </div>
            <button class="btn btn-primary rounded-pill px-3" data-bs-toggle="modal" data-bs-target="#createPostModal">
                <i class="fa-solid fa-plus me-1"></i> Đăng bài mới
            </button>
        </div>

        <!-- Timeline -->
        <div id="postsList">
            <div class="text-center py-5 text-muted">
                <div class="spinner-border text-primary me-2"></div> Đang tải dữ liệu...
            </div>
        </div>
    </div>

    <!-- Modal đăng bài -->
    <div class="modal fade" id="createPostModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Tạo bài viết / Chia sẻ tài liệu</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Tên của bạn</label>
                        <input type="text" id="authorInput" class="form-field form-control" placeholder="Nhập tên của bạn...">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Nội dung</label>
                        <textarea id="contentInput" class="form-control" rows="4" placeholder="Nội dung bài viết hoặc mô tả tài liệu..."></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Tệp đính kèm (Ảnh, Video, Tài liệu < 25MB)</label>
                        <input type="file" id="fileInput" class="form-control">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                    <button type="button" class="btn btn-primary" onclick="submitPost()">Đăng ngay</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Khởi tạo Token thiết bị người dùng
        function getAuthorToken() {
            let token = localStorage.getItem('authorToken');
            if (!token) {
                token = 'user_' + Math.random().toString(36).substring(2, 15);
                localStorage.setItem('authorToken', token);
            }
            return token;
        }

        // Tải danh sách bài viết
        async function loadPosts() {
            const container = document.getElementById('postsList');
            try {
                const res = await fetch('/api/posts');
                if (!res.ok) throw new Error("Lỗi máy chủ");
                const posts = await res.json();

                if (posts.length === 0) {
                    container.innerHTML = `<div class="text-center py-5 text-muted">Chưa có bài viết nào. Hãy là người đầu tiên chia sẻ!</div>`;
                    return;
                }

                const myToken = getAuthorToken();
                container.innerHTML = posts.map(post => {
                    const isVip = post.isAdmin;
                    const canDelete = !post.authorToken || post.authorToken === myToken;

                    return `
                        <div class="post-card p-3 mb-3 ${isVip ? 'vip-border' : ''}">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <div>
                                    <strong class="text-dark">${escapeHtml(post.author)}</strong>
                                    ${isVip ? '<span class="vip-badge" title="Tài khoản VIP"><i class="fa-solid fa-circle-check"></i> VIP</span>' : ''}
                                    <br><small class="text-muted" style="font-size:11px;">${new Date(post.createdAt).toLocaleString('vi-VN')}</small>
                                </div>
                                ${canDelete ? `<button class="btn btn-sm btn-outline-danger border-0" onclick="deletePost('${post._id}')"><i class="fa-solid fa-trash"></i></button>` : ''}
                            </div>
                            <p class="mb-2 text-secondary" style="white-space: pre-wrap;">${escapeHtml(post.content || '')}</p>
                            
                            ${post.mediaName ? `
                                <div class="my-2 p-2 bg-light rounded" id="media-box-${post._id}">
                                    <button class="btn btn-sm btn-outline-primary" onclick="loadMedia('${post._id}')">
                                        <i class="fa-solid fa-paperclip me-1"></i> Xem tệp đính kèm: <strong>${escapeHtml(post.mediaName)}</strong>
                                    </button>
                                </div>
                            ` : ''}

                            <div class="d-flex gap-2 mt-3 pt-2 border-top">
                                <button class="btn btn-sm btn-light border rounded-pill px-3" onclick="likePost('${post._id}')">
                                    <i class="fa-regular fa-thumbs-up text-primary me-1"></i> ${post.likes || 0}
                                </button>
                                <button class="btn btn-sm btn-light border rounded-pill px-3" onclick="dislikePost('${post._id}')">
                                    <i class="fa-regular fa-thumbs-down text-danger me-1"></i> ${post.dislikes || 0}
                                </button>
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (err) {
                container.innerHTML = `
                    <div class="text-center py-4 bg-white rounded shadow-sm">
                        <p class="text-danger mb-2"><i class="fa-solid fa-triangle-exclamation me-1"></i> Kết nối chưa ổn định</p>
                        <button class="btn btn-sm btn-primary rounded-pill" onclick="loadPosts()"><i class="fa-solid fa-rotate-right me-1"></i> Tải lại trang</button>
                    </div>
                `;
            }
        }

        // Tải media riêng biệt để tránh nghẽn mạng
        async function loadMedia(postId) {
            const box = document.getElementById(`media-box-${postId}`);
            box.innerHTML = `<span class="text-muted small"><i class="fa-solid fa-spinner fa-spin me-1"></i> Đang tải tệp...</span>`;
            try {
                const res = await fetch(`/api/posts/${postId}/media`);
                const data = await res.json();
                if (data.mediaUrl) {
                    if (data.mediaUrl.startsWith('data:image')) {
                        box.innerHTML = `<img src="${data.mediaUrl}" class="img-fluid rounded" alt="media">`;
                    } else if (data.mediaUrl.startsWith('data:video')) {
                        box.innerHTML = `<video controls class="w-100 rounded"><source src="${data.mediaUrl}"></video>`;
                    } else {
                        box.innerHTML = `<a href="${data.mediaUrl}" download="${data.mediaName}" class="btn btn-sm btn-success"><i class="fa-solid fa-download me-1"></i> Tải về ${escapeHtml(data.mediaName)}</a>`;
                    }
                }
            } catch (err) {
                box.innerHTML = `<span class="text-danger small">Không thể tải tệp đính kèm này.</span>`;
            }
        }

        // Đăng bài viết
        async function submitPost() {
            const author = document.getElementById('authorInput').value.trim();
            const content = document.getElementById('contentInput').value.trim();
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];

            if (!content && !file) {
                alert("Vui lòng nhập nội dung hoặc chọn tệp đính kèm!");
                return;
            }

            let mediaUrl = '';
            let mediaName = '';

            if (file) {
                if (file.size > 25 * 1024 * 1024) {
                    alert("Tệp vượt quá dung lượng cho phép (tối đa 25MB)!");
                    return;
                }
                mediaName = file.name;
                mediaUrl = await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = e => resolve(e.target.result);
                    reader.readAsDataURL(file);
                });
            }

            try {
                const response = await fetch('/api/posts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        author,
                        content,
                        mediaUrl,
                        mediaName,
                        authorToken: getAuthorToken()
                    })
                });

                if (response.ok) {
                    document.getElementById('contentInput').value = '';
                    document.getElementById('fileInput').value = '';
                    bootstrap.Modal.getInstance(document.getElementById('createPostModal')).hide();
                    loadPosts();
                } else {
                    alert("Đã xảy ra lỗi khi gửi bài!");
                }
            } catch (err) {
                alert("Lỗi kết nối máy chủ!");
            }
        }

        async function likePost(id) {
            await fetch(`/api/posts/${id}/like`, { method: 'POST' });
            loadPosts();
        }

        async function dislikePost(id) {
            await fetch(`/api/posts/${id}/dislike`, { method: 'POST' });
            loadPosts();
        }

        async function deletePost(id) {
            if (!confirm("Bạn có chắc chắn muốn xóa bài viết này?")) return;
            const res = await fetch(`/api/posts/${id}`, {
                method: 'DELETE',
                headers: { 'x-author-token': getAuthorToken() }
            });
            if (res.ok) loadPosts();
            else alert("Bạn không có quyền xóa bài viết này!");
        }

        function escapeHtml(str) {
            return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        loadPosts();
    </script>

    <!-- Google Translate Script -->
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'vi',
                includedLanguages: 'vi,en,zh-CN,ja,ko,fr,de,es',
                layout: google.translate.TranslateElement.InlineLayout.SIMPLE
            }, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
