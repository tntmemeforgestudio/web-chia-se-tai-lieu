<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TNT MemeForge Studio - Cộng đồng & Dự án Game</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --vip-gradient: linear-gradient(135deg, #f59e0b 0%, #ec4899 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            padding-bottom: 50px;
        }

        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            background: var(--vip-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .server-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 8px #22c55e;
        }

        .container {
            max-width: 700px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        /* Khung đăng bài */
        .post-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.25rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .post-box input, .post-box textarea {
            width: 100%;
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.75rem;
            color: var(--text-color);
            margin-bottom: 0.75rem;
            font-size: 0.95rem;
        }

        .post-box textarea {
            resize: vertical;
            min-height: 100px;
        }

        .post-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .file-upload-label {
            cursor: pointer;
            color: var(--primary-color);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.5rem 1.25rem;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        /* Thẻ bài viết */
        .post-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.25rem;
            margin-bottom: 1rem;
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .author-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            background: var(--primary-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
        }

        .avatar.vip {
            background: var(--vip-gradient);
        }

        .author-name {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .post-time {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .post-content {
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 1rem;
            white-space: pre-wrap;
        }

        .post-file-preview {
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 1rem;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .post-footer {
            display: flex;
            gap: 15px;
            border-top: 1px solid var(--border-color);
            padding-top: 0.75rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .action-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: color 0.2s;
        }

        .action-btn:hover, .action-btn.active {
            color: var(--primary-color);
        }

        /* Modal Bình luận */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            width: 90%;
            max-width: 600px;
            max-height: 85vh;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .modal-header {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-body {
            padding: 1rem;
            overflow-y: auto;
            flex-grow: 1;
        }

        .comment-item {
            margin-bottom: 0.75rem;
            padding: 8px;
            background: #0f172a;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .comment-reply {
            margin-left: 20px;
            border-left: 2px solid var(--border-color);
            padding-left: 10px;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">TNT MemeForge Studio</div>
        <div class="server-status">
            <div class="status-dot"></div>
            <span id="server-status-text">Đang kết nối Server...</span>
        </div>
    </header>

    <div class="container">
        <!-- Khung đăng bài -->
        <div class="post-box">
            <input type="text" id="post-author" placeholder="Tên của bạn (hoặc biệt danh)...">
            <textarea id="post-content" placeholder="Bạn đang nghĩ gì về game hoặc dự án sắp tới?"></textarea>
            <div class="post-actions">
                <label class="file-upload-label">
                    <i class="fa-solid fa-paperclip"></i> Đính kèm tệp
                    <input type="file" id="post-file" style="display: none;" onchange="handleFileSelect(event)">
                </label>
                <button class="btn" onclick="submitPost()">Đăng bài</button>
            </div>
            <div id="file-info" style="font-size: 0.8rem; color: var(--text-muted); margin-top: 5px;"></div>
        </div>

        <!-- Danh sách bài viết -->
        <div id="posts-container">
            <!-- Render bài viết tự động ở đây -->
        </div>
    </div>

    <!-- Modal Bình luận -->
    <div id="comment-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Bình luận</h3>
                <button class="action-btn" onclick="closeCommentModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body" id="modal-comments-list">
                <!-- Nội dung bình luận hiển thị ở đây -->
            </div>
            <div style="padding: 1rem; border-top: 1px solid var(--border-color);">
                <input type="text" id="comment-author" placeholder="Tên của bạn..." style="width: 100%; padding: 6px; margin-bottom: 6px; background: #0f172a; border: 1px solid var(--border-color); color: white; border-radius: 6px;">
                <div style="display: flex; gap: 8px;">
                    <input type="text" id="comment-input" placeholder="Viết bình luận..." style="flex-grow: 1; padding: 6px; background: #0f172a; border: 1px solid var(--border-color); color: white; border-radius: 6px;">
                    <button class="btn" onclick="submitComment()">Gửi</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api';
        let authorToken = localStorage.getItem('tnt_author_token');
        if (!authorToken) {
            authorToken = 'token_' + Math.random().toString(36).substring(2, 15);
            localStorage.setItem('tnt_author_token', authorToken);
        }

        let selectedFile = null;
        let currentPostIdForComment = null;
        let currentReplyParentId = null;

        // Khởi động khi tải trang
        window.onload = () => {
            checkServerStatus();
            loadPosts();
            setInterval(loadPosts, 5000); // Tự động làm mới bài viết mỗi 5 giây
        };

        async function checkServerStatus() {
            try {
                const res = await fetch(`${API_URL}/health`);
                const data = await res.json();
                document.getElementById('server-status-text').innerText = data.message;
            } catch (err) {
                document.getElementById('server-status-text').innerText = 'Mất kết nối Server';
                document.querySelector('.status-dot').style.backgroundColor = '#ef4444';
            }
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                selectedFile = {
                    fileData: e.target.result,
                    fileName: file.name,
                    fileSize: (file.size / 1024).toFixed(1) + ' KB',
                    fileType: file.type
                };
                document.getElementById('file-info').innerText = `Đã đính kèm: ${file.name}`;
            };
            reader.readAsDataURL(file);
        }

        async function loadPosts() {
            try {
                const res = await fetch(`${API_URL}/posts`, {
                    headers: { 'x-author-token': authorToken }
                });
                const posts = await res.json();
                const container = document.getElementById('posts-container');
                
                if (posts.length === 0) {
                    container.innerHTML = '<p style="text-align: center; color: var(--text-muted);">Chưa có bài viết nào.</p>';
                    return;
                }

                container.innerHTML = posts.map(post => `
                    <div class="post-card">
                        <div class="post-header">
                            <div class="author-info">
                                <div class="avatar ${post.isVip ? 'vip' : ''}">${post.author.charAt(0).toUpperCase()}</div>
                                <div>
                                    <div class="author-name">${post.author} ${post.isVip ? '⭐' : ''}</div>
                                    <div class="post-time">${new Date(post.createdAt).toLocaleTimeString()} - ${new Date(post.createdAt).toLocaleDateString()}</div>
                                </div>
                            </div>
                            ${post.isOwner ? `<button class="action-btn" onclick="deletePost('${post._id}')"><i class="fa-solid fa-trash"></i></button>` : ''}
                        </div>
                        <div class="post-content">${post.content}</div>
                        ${post.fileName ? `
                            <div class="post-file-preview">
                                <i class="fa-solid fa-file"></i> 
                                <a href="${post.fileData}" download="${post.fileName}" style="color: var(--primary-color); text-decoration: none;">${post.fileName} (${post.fileSize})</a>
                            </div>
                        ` : ''}
                        <div class="post-footer">
                            <button class="action-btn ${post.hasLiked ? 'active' : ''}" onclick="toggleLike('${post._id}')">
                                <i class="fa-solid fa-thumbs-up"></i> ${post.likes || 0}
                            </button>
                            <button class="action-btn ${post.hasDisliked ? 'active' : ''}" onclick="toggleDislike('${post._id}')">
                                <i class="fa-solid fa-thumbs-down"></i> ${post.dislikes || 0}
                            </button>
                            <button class="action-btn" onclick="openCommentModal('${post._id}')">
                                <i class="fa-solid fa-comment"></i> ${post.commentCount || 0} Bình luận
                            </button>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                console.error('Lỗi tải bài viết:', err);
            }
        }

        async function submitPost() {
            const author = document.getElementById('post-author').value.trim() || 'Ẩn danh';
            const content = document.getElementById('post-content').value.trim();

            if (!content && !selectedFile) {
                alert('Vui lòng nhập nội dung hoặc đính kèm tệp!');
                return;
            }

            const payload = {
                author,
                content,
                authorToken,
                ...(selectedFile || {})
            };

            try {
                const res = await fetch(`${API_URL}/posts`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    document.getElementById('post-content').value = '';
                    document.getElementById('post-file').value = '';
                    document.getElementById('file-info').innerText = '';
                    selectedFile = null;
                    loadPosts();
                }
            } catch (err) {
                alert('Lỗi khi đăng bài!');
            }
        }

        async function deletePost(postId) {
            if (!confirm('Bạn có chắc muốn xóa bài viết này không?')) return;

            try {
                const res = await fetch(`${API_URL}/posts/${postId}`, {
                    method: 'DELETE',
                    headers: { 'x-author-token': authorToken }
                });
                if (res.ok) loadPosts();
            } catch (err) {
                alert('Không thể xóa bài viết');
            }
        }

        async function toggleLike(postId) {
            await fetch(`${API_URL}/posts/${postId}/like`, {
                method: 'POST',
                headers: { 'x-author-token': authorToken }
            });
            loadPosts();
        }

        async function toggleDislike(postId) {
            await fetch(`${API_URL}/posts/${postId}/dislike`, {
                method: 'POST',
                headers: { 'x-author-token': authorToken }
            });
            loadPosts();
        }

        async function openCommentModal(postId) {
            currentPostIdForComment = postId;
            document.getElementById('comment-modal').style.display = 'flex';
            loadComments(postId);
        }

        function closeCommentModal() {
            document.getElementById('comment-modal').style.display = 'none';
            currentPostIdForComment = null;
            currentReplyParentId = null;
        }

        async function loadComments(postId) {
            try {
                const res = await fetch(`${API_URL}/posts/${postId}/comments`, {
                    headers: { 'x-author-token': authorToken }
                });
                const data = await res.json();
                const listEl = document.getElementById('modal-comments-list');

                const rootComments = data.comments.filter(c => !c.parentId);
                
                listEl.innerHTML = rootComments.map(c => renderCommentNode(c, data.comments)).join('');
            } catch (err) {
                console.error('Lỗi tải bình luận');
            }
        }

        function renderCommentNode(comment, allComments) {
            const replies = allComments.filter(c => c.parentId === comment._id);
            return `
                <div class="comment-item">
                    <strong>${comment.author}</strong>: ${comment.content}
                    <div style="font-size: 0.75rem; color: var(--text-muted); margin-top: 3px;">
                        <button class="action-btn" style="display:inline;" onclick="setReplyParent('${comment._id}', '${comment.author}')">Trả lời</button>
                    </div>
                    ${replies.map(r => `
                        <div class="comment-reply">
                            <strong>${r.author}</strong>:${r.content}
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function setReplyParent(parentId, authorName) {
            currentReplyParentId = parentId;
            document.getElementById('comment-input').placeholder = `Đang trả lời @${authorName}...`;
            document.getElementById('comment-input').focus();
        }

        async function submitComment() {
            if (!currentPostIdForComment) return;
            const author = document.getElementById('comment-author').value.trim() || 'Ẩn danh';
            const content = document.getElementById('comment-input').value.trim();

            if (!content) return;

            try {
                await fetch(`${API_URL}/posts/${currentPostIdForComment}/comments`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        author,
                        content,
                        parentId: currentReplyParentId,
                        authorToken
                    })
                });

                document.getElementById('comment-input').value = '';
                document.getElementById('comment-input').placeholder = 'Viết bình luận...';
                currentReplyParentId = null;
                loadComments(currentPostIdForComment);
                loadPosts(); // Cập nhật lại số lượng bình luận ngoài trang chủ
            } catch (err) {
                alert('Không thể gửi bình luận');
            }
        }
    </script>
</body>
</html>
