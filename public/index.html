<!DOCTYPE html>
<html lang="vi" style="height: 100%;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Góc Chia Sẻ Tài Liệu</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            background-color: #f8f9fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        
        /* Smart Header Styles */
        .smart-header {
            position: sticky;
            top: 0;
            z-index: 1000;
            transition: transform 0.3s ease;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #e9ecef;
        }
        .header-hidden {
            transform: translateY(-100%);
        }

        /* Avatar Styles */
        .avatar-circle {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            flex-shrink: 0;
        }

        .avatar-gold-glossy {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ffe066 0%, #f59e0b 50%, #d97706 100%);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            box-shadow: 0 2px 8px rgba(245, 158, 11, 0.4);
            border: 2px solid #fff;
            flex-shrink: 0;
        }

        /* Post Card Styles */
        .post-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.04);
            border: 1px solid #f0f0f0;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .post-card:hover {
            box-shadow: 0 4px 18px rgba(0,0,0,0.08);
        }

        .vip-card {
            border: 1px solid rgba(245, 158, 11, 0.3);
            background: linear-gradient(180deg, #ffffff 0%, #fffdfa 100%);
        }

        /* Vote Buttons */
        .btn-vote {
            border-radius: 20px;
            padding: 6px 16px;
            font-size: 14px;
            border: 1px solid #e5e7eb;
            background-color: #f9fafb;
            color: #4b5563;
            transition: all 0.2s;
        }
        .btn-vote:hover {
            background-color: #f3f4f6;
        }
        .btn-vote.active-like {
            background-color: #e0f2fe;
            color: #0284c7;
            border-color: #38bdf8;
        }
        .btn-vote.active-dislike {
            background-color: #fee2e2;
            color: #dc2626;
            border-color: #f87171;
        }

        .main-container {
            max-width: 680px;
            margin: 0 auto;
            padding: 20px 15px;
        }
    </style>
</head>
<body style="position: relative; min-height: 100%; top: 0px;">

    <!-- Smart Header -->
    <header id="smartHeader" class="smart-header py-2 px-3 shadow-sm mb-4">
        <div class="container main-container d-flex justify-content-between align-items-center p-0">
            <h5 class="fw-bold m-0 text-primary">Góc Chia Sẻ Tài Liệu</h5>
            <div class="d-flex align-items-center gap-2">
                <div id="google_translate_element"></div>
                <button class="btn btn-sm btn-outline-secondary rounded-circle" data-bs-toggle="modal" data-bs-target="#settingsModal">
                    <i class="fa-solid fa-gear"></i>
                </button>
                <button class="btn btn-sm btn-primary rounded-pill px-3 fw-bold" data-bs-toggle="modal" data-bs-target="#postModal">
                    <i class="fa-solid fa-plus me-1"></i>Đăng bài
                </button>
            </div>
        </div>
    </header>

    <div class="container main-container">
        <!-- Danh sách bài viết -->
        <div id="postsList">
            <div class="text-center py-5 text-muted">
                <i class="fa-solid fa-spinner fa-spin me-2"></i>Đang tải bài viết...
            </div>
        </div>
    </div>

    <!-- Modal Đăng Bài -->
    <div id="postModal" class="modal fade" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg" style="border-radius: 20px;">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold">Tạo bài viết mới</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label text-muted small fw-bold">Tên của bạn (Tùy chọn)</label>
                        <input type="text" id="authorInput" class="form-control rounded-3" placeholder="Ẩn danh">
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted small fw-bold">Nội dung bài viết</label>
                        <textarea id="contentInput" class="form-control rounded-3" rows="4" placeholder="Chia sẻ tài liệu hoặc câu hỏi của bạn..."></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted small fw-bold">Đính kèm Tệp / Hình ảnh / Video (Tối đa 20MB)</label>
                        <input type="file" id="fileInput" class="form-control rounded-3">
                    </div>
                </div>
                <div class="modal-footer border-0 pt-0">
                    <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Hủy</button>
                    <button type="button" class="btn btn-primary rounded-pill px-4" onclick="submitPost()">Đăng ngay</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Cài Đặt -->
    <div id="settingsModal" class="modal fade" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow" style="border-radius: 20px;">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold">Cài đặt</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center py-4">
                    <p class="text-muted">Phiên bản 1.0.0 — Hệ thống chia sẻ tài liệu bảo mật.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Xóa Bài Viết -->
    <div id="deleteConfirmModal" class="modal fade" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content border-0 shadow" style="border-radius: 20px;">
                <div class="modal-body text-center p-4">
                    <i class="fa-solid fa-triangle-exclamation text-warning mb-3" style="font-size: 40px;"></i>
                    <h6 class="fw-bold mb-2">Xác nhận xóa bài?</h6>
                    <p class="text-muted small mb-4">Hành động này không thể hoàn tác.</p>
                    <div class="d-flex justify-content-center gap-2">
                        <button type="button" class="btn btn-light rounded-pill px-3" data-bs-dismiss="modal">Hủy</button>
                        <button type="button" class="btn btn-danger rounded-pill px-3" onclick="confirmDeletePost()">Xóa bài</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Main Application Logic -->
    <script>
        let selectedPostIdToDelete = null; 
        let isFirstLoad = true; 
        let lastScrollTop = 0; 
        
        // Smart Header Scroll Behavior
        const smartHeader = document.getElementById('smartHeader'); 
        window.addEventListener('scroll', function() { 
            let scrollTop = window.pageYOffset || document.documentElement.scrollTop; 
            if (scrollTop > lastScrollTop && scrollTop > 100) { 
                smartHeader.classList.add('header-hidden'); 
            } else { 
                smartHeader.classList.remove('header-hidden'); 
            } 
            lastScrollTop = scrollTop <= 0 ? 0 : scrollTop; 
        }, false);

        // Lấy hoặc tạo Author Token ở Storage người dùng
        function getAuthorToken() { 
            let token = localStorage.getItem('authorToken'); 
            if (!token) { 
                token = 'user_' + Math.random().toString(36).substring(2, 15); 
                localStorage.setItem('authorToken', token); 
            } 
            return token; 
        }

        // Tạo màu Avatar ngẫu nhiên theo tên
        function getAvatarColor(name) { 
            const colors = ['#8d5efd', '#6f42c1', '#d63384', '#fd7e14', '#198754', '#20c997', '#0dcaf0']; 
            let hash = 0; 
            for (let i = 0; i < name.length; i++) { 
                hash = name.charCodeAt(i) + ((hash << 5) - hash); 
            } 
            return colors[Math.abs(hash) % colors.length]; 
        }

        // Tải danh sách bài viết từ Backend (🔒 Bảo mật 100%)
        async function loadPosts(isSilent = false) { 
            const container = document.getElementById('postsList'); 
            try { 
                const res = await fetch('/api/posts'); 
                if (!res.ok) throw new Error("Server error"); 
                const posts = await res.json(); 
                
                if (posts.length === 0) { 
                    container.innerHTML = '<div class="text-center py-5 text-muted">Chưa có bài viết nào.</div>'; 
                    isFirstLoad = false; 
                    return; 
                } 

                const myToken = getAuthorToken(); 
                const currentScroll = window.scrollY; 

                // SVG Tích Vàng VIP
                const goldTickIconSVG = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="vertical-align: middle; margin-left: 4px; filter: drop-shadow(0px 1px 2px rgba(245, 158, 11, 0.5));">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z" fill="#f59e0b"/>
                </svg>`;

                container.innerHTML = posts.map(post => { 
                    const isOwner = (post.authorToken === myToken); 
                    const authorName = post.author || 'Ẩn danh';
                    const isVip = post.isVip || false; // 🔒 Lấy trạng thái VIP an toàn từ Server

                    const firstChar = authorName.charAt(0).toUpperCase(); 
                    const avatarClass = isVip ? 'avatar-gold-glossy' : 'avatar-circle'; 
                    const avatarBg = isVip ? '' : `background-color: ${getAvatarColor(authorName)};`; 

                    const hasLiked = localStorage.getItem(`voted_like_${post._id}`) === 'true';
                    const hasDisliked = localStorage.getItem(`voted_dislike_${post._id}`) === 'true';

                    return `
                    <div class="post-card ${isVip ? 'vip-card' : ''}">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <div class="d-flex align-items-center gap-2">
                                <div class="${avatarClass}" style="${avatarBg}">${firstChar}</div>
                                <div>
                                    <div class="d-flex align-items-center">
                                        <strong>${escapeHtml(authorName)}</strong>
                                        ${isVip ? goldTickIconSVG : ''}
                                    </div>
                                    <small class="text-muted" style="font-size: 11px;">${new Date(post.createdAt).toLocaleString('vi-VN')}</small>
                                </div>
                            </div>
                            ${isOwner ? `
                                <div class="dropdown">
                                    <button class="btn btn-link text-muted p-0 dropdown-toggle" data-bs-toggle="dropdown"><i class="fa-solid fa-ellipsis"></i></button>
                                    <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0" style="border-radius: 12px;">
                                        <li><a class="dropdown-item text-danger small" href="#" onclick="openDeleteModal('${post._id}')"><i class="fa-solid fa-trash me-2"></i>Xóa bài viết</a></li>
                                    </ul>
                                </div>
                            ` : ''}
                        </div>
                        <div class="text-secondary post-content mb-3" style="white-space: pre-line;">${escapeHtml(post.content)}</div>
                        ${post.mediaName ? `
                            <div class="mb-3" id="media-container-${post._id}">
                                <button class="btn btn-sm btn-outline-primary rounded-pill" onclick="loadMedia('${post._id}')">
                                    <i class="fa-solid fa-paperclip me-1"></i>Xem tệp đính kèm: ${escapeHtml(post.mediaName)}
                                </button>
                            </div>
                        ` : ''}
                        <div class="d-flex gap-2 pt-2 border-top">
                            <button class="btn btn-vote ${hasLiked ? 'active-like' : ''}" onclick="toggleVote('${post._id}', 'like')">
                                <i class="fa-${hasLiked ? 'solid' : 'regular'} fa-thumbs-up me-1"></i>${post.likes || 0}
                            </button>
                            <button class="btn btn-vote ${hasDisliked ? 'active-dislike' : ''}" onclick="toggleVote('${post._id}', 'dislike')">
                                <i class="fa-${hasDisliked ? 'solid' : 'regular'} fa-thumbs-down me-1"></i>${post.dislikes || 0}
                            </button>
                        </div>
                    </div>`; 
                }).join(''); 

                if (!isSilent) { 
                    window.scrollTo(0, currentScroll); 
                } 
                isFirstLoad = false; 
            } catch (err) { 
                if (isFirstLoad) { 
                    container.innerHTML = `
                        <div class="text-center py-4 bg-white rounded-4 shadow-sm">
                            <p class="text-danger mb-2" style="font-size:14px;"><i class="fa-solid fa-triangle-exclamation me-1"></i>Kết nối máy chủ bị xán đoạn...</p>
                            <button class="btn btn-sm btn-primary rounded-pill px-3" onclick="loadPosts()"><i class="fa-solid fa-rotate me-1"></i>Tải lại</button>
                        </div>`; 
                } 
            } 
        }

        // Tải File / Media đính kèm
        async function loadMedia(postId) { 
            const container = document.getElementById(`media-container-${postId}`); 
            container.innerHTML = '<span class="text-muted small"><i class="fa-solid fa-spinner fa-spin me-1"></i>Đang tải...</span>'; 
            try { 
                const res = await fetch(`/api/posts/${postId}/media`); 
                const data = await res.json(); 
                if (res.ok) { 
                    if (data.mediaUrl.startsWith('data:image')) { 
                        container.innerHTML = `<img src="${data.mediaUrl}" class="img-fluid rounded-3" style="max-height: 400px;">`; 
                    } else if (data.mediaUrl.startsWith('data:video')) { 
                        container.innerHTML = `<video controls class="w-100 rounded-3"><source src="${data.mediaUrl}"></video>`; 
                    } else { 
                        container.innerHTML = `<a href="${data.mediaUrl}" download="${data.mediaName}" class="btn btn-sm btn-success rounded-pill"><i class="fa-solid fa-download me-1"></i>Tải về ${escapeHtml(data.mediaName)}</a>`; 
                    } 
                } 
            } catch (err) { 
                container.innerHTML = '<span class="text-danger small">Lỗi tải tệp.</span>'; 
            } 
        }

        // Xử lý Thích / Không thích
        async function toggleVote(postId, type) { 
            const key = `voted_${type}_${postId}`; 
            const isVoted = localStorage.getItem(key) === 'true'; 
            const action = isVoted ? 'remove' : 'add'; 
            const oppositeType = type === 'like' ? 'dislike' : 'like'; 
            const oppositeKey = `voted_${oppositeType}_${postId}`; 

            if (localStorage.getItem(oppositeKey) === 'true') { 
                await fetch(`/api/posts/${postId}/vote`, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ type: oppositeType, action: 'remove' }) 
                }); 
                localStorage.removeItem(oppositeKey); 
            } 

            try { 
                const res = await fetch(`/api/posts/${postId}/vote`, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ type, action }) 
                }); 
                if (res.ok) { 
                    if (isVoted) localStorage.removeItem(key); 
                    else localStorage.setItem(key, 'true'); 
                    loadPosts(true); 
                } 
            } catch (err) { 
                console.error("Lỗi vote:", err); 
            } 
        }

        // Gửi bài viết mới lên Server
        async function submitPost() { 
            const author = document.getElementById('authorInput').value.trim(); 
            const content = document.getElementById('contentInput').value.trim(); 
            const fileInput = document.getElementById('fileInput'); 
            const file = fileInput.files[0]; 

            if (!content && !file) { 
                alert("Vui lòng nhập nội dung hoặc đính kèm tệp!"); 
                return; 
            } 

            let mediaUrl = ""; 
            let mediaName = ""; 

            if (file) { 
                if (file.size > 20 * 1024 * 1024) { 
                    alert("Tệp quá lớn (tối đa 20MB)!"); 
                    return; 
                } 
                mediaName = file.name; 
                mediaUrl = await new Promise((resolve) => { 
                    const reader = new FileReader(); 
                    reader.onload = (e) => resolve(e.target.result); 
                    reader.readAsDataURL(file); 
                }); 
            } 

            try { 
                const res = await fetch('/api/posts', { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ 
                        author, 
                        content, 
                        mediaUrl, 
                        mediaName, 
                        authorToken: getAuthorToken() 
                    }) 
                }); 

                if (res.ok) { 
                    document.getElementById('contentInput').value = ''; 
                    document.getElementById('fileInput').value = ''; 
                    const modalEl = document.getElementById('postModal');
                    const modal = bootstrap.Modal.getInstance(modalEl);
                    if (modal) modal.hide();
                    loadPosts(false); 
                } 
            } catch (err) { 
                alert("Lỗi máy chủ khi gửi bài!"); 
            } 
        }

        // Mở Modal xóa bài
        function openDeleteModal(id) { 
            selectedPostIdToDelete = id; 
            const modal = new bootstrap.Modal(document.getElementById('deleteConfirmModal')); 
            modal.show(); 
        }

        // Xác nhận xóa bài (Gửi Token về Server kiểm tra)
        async function confirmDeletePost() { 
            if (!selectedPostIdToDelete) return; 
            try { 
                const res = await fetch(`/api/posts/${selectedPostIdToDelete}`, { 
                    method: 'DELETE', 
                    headers: { 'x-author-token': getAuthorToken() } 
                }); 
                
                const modalElement = document.getElementById('deleteConfirmModal'); 
                const modal = bootstrap.Modal.getInstance(modalElement); 
                if (modal) modal.hide(); 

                if (res.ok) { 
                    loadPosts(false); 
                } else { 
                    alert("Bạn không có quyền xóa bài viết này!"); 
                } 
            } catch (err) { 
                alert("Lỗi kết nối máy chủ"); 
            } 
        }

        // Phòng chống lỗi XSS
        function escapeHtml(str) { 
            return (str || '')
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;"); 
        }

        // Khởi tạo ứng dụng
        loadPosts(); 
        setInterval(() => loadPosts(true), 4000);
    </script>

    <!-- Google Translate Script -->
    <script type="text/javascript">
        function googleTranslateElementInit() { 
            new google.translate.TranslateElement({ 
                pageLanguage: 'vi', 
                includedLanguages: 'vi,en,zh-CN,ja,ko,fr,de', 
                layout: google.translate.TranslateElement.InlineLayout.SIMPLE 
            }, 'google_translate_element'); 
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
